<svg xmlns="http://www.w3.org/2000/svg" class="dg" role="img" viewBox="0 0 990 192" width="990" height="192"><title>Brief, then Requirements (3 labels), then gate, then Options (2 or 3), then gate, then Trade-offs (+ / − table), then gate, then Decision record (Context · Decision · Consequence), then gate.</title><style>text{font-family:"Helvetica Neue",Arial,sans-serif}.dg{display:block;max-width:100%;height:auto;margin:0 auto;overflow:visible;font-family:inherit}.dg rect{stroke-width:1.2}.dg-title{font-size:12.5px;font-weight:600;text-anchor:middle;fill:#1a1a1a}.dg-sub{font-family:"SF Mono",Consolas,monospace;font-size:10px;text-anchor:middle;fill:#5c5c5c}.dg-data rect{fill:#fff;stroke:#9aa5b1;stroke-dasharray:4 3}.dg-code rect{fill:#fff;stroke:#c9d2da}.dg-model rect{fill:#1a1a1a;stroke:#1a1a1a}.dg-model .dg-title{fill:#fff}.dg-model .dg-sub{fill:#c6ced6}.dg-dot{fill:#14a800}.dg-check rect{fill:#fff;stroke:#1a1a1a;stroke-width:1.6}.dg-human rect{fill:#e8f5e4;stroke:#14a800}.dg-gate path{fill:#fff;stroke:#1a1a1a;stroke-width:1.6}.dg-gate-label{font-size:10.5px;font-weight:600;text-anchor:middle;fill:#1a1a1a}.dg-edge{fill:none;stroke:#7b8794;stroke-width:1.3}.dg marker path{fill:#7b8794}.dg-exit{stroke-dasharray:3 3}.dg-loop{stroke:#108a00;stroke-dasharray:5 3}.dg-edge-label,.dg-exit-label,.dg-loop-label{font-size:10.5px;fill:#5c5c5c;text-anchor:middle}.dg-loop-label{fill:#108a00;font-weight:600}.dg-start{text-anchor:start}.dg-end{text-anchor:end}.dg-legend-text{font-size:11px;fill:#5c5c5c}</style><rect width="990" height="192" rx="12" fill="#f3f5f7"/><defs><marker id="arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L8 4L0 8Z"/></marker></defs><g transform="translate(18 18)"><path class="dg-edge" d="M120 77H148" marker-end="url(#arrow)"/><path class="dg-edge" d="M268 77H296" marker-end="url(#arrow)"/><path class="dg-edge" d="M328 77H356" marker-end="url(#arrow)"/><path class="dg-edge" d="M476 77H504" marker-end="url(#arrow)"/><path class="dg-edge" d="M536 77H564" marker-end="url(#arrow)"/><path class="dg-edge" d="M684 77H712" marker-end="url(#arrow)"/><path class="dg-edge" d="M744 77H772" marker-end="url(#arrow)"/><path class="dg-edge" d="M892 77H920" marker-end="url(#arrow)"/><path class="dg-edge dg-exit" d="M313 62V22" marker-end="url(#arrow)"/><text class="dg-exit-label" x="313" y="16">fail → stop</text><g class="dg-data"><rect x="2" y="48" width="118" height="58" rx="22"/><text class="dg-title" x="61" y="81">Brief</text></g><g class="dg-model"><rect x="150" y="48" width="118" height="58" rx="8"/><circle class="dg-dot" cx="259" cy="57" r="3"/><text class="dg-title" x="209" y="74">Requirements</text><text class="dg-sub" x="209" y="88">3 labels</text></g><g class="dg-gate"><title>gate</title><path d="M313 62L328 77L313 92L298 77Z"/><text class="dg-gate-label" x="313" y="104"><tspan x="313" dy="0">gate</tspan></text></g><g class="dg-model"><rect x="358" y="48" width="118" height="58" rx="8"/><circle class="dg-dot" cx="467" cy="57" r="3"/><text class="dg-title" x="417" y="74">Options</text><text class="dg-sub" x="417" y="88">2 or 3</text></g><g class="dg-gate"><title>gate</title><path d="M521 62L536 77L521 92L506 77Z"/><text class="dg-gate-label" x="521" y="104"><tspan x="521" dy="0">gate</tspan></text></g><g class="dg-model"><rect x="566" y="48" width="118" height="58" rx="8"/><circle class="dg-dot" cx="675" cy="57" r="3"/><text class="dg-title" x="625" y="74">Trade-offs</text><text class="dg-sub" x="625" y="88">+ / − table</text></g><g class="dg-gate"><title>gate</title><path d="M729 62L744 77L729 92L714 77Z"/><text class="dg-gate-label" x="729" y="104"><tspan x="729" dy="0">gate</tspan></text></g><g class="dg-model"><rect x="774" y="40" width="118" height="74" rx="8"/><circle class="dg-dot" cx="883" cy="49" r="3"/><text class="dg-title" x="833" y="60">Decision record</text><text class="dg-sub" x="833" y="74">Context ·</text><text class="dg-sub" x="833" y="87">Decision ·</text><text class="dg-sub" x="833" y="100">Consequence</text></g><g class="dg-gate"><title>gate</title><path d="M937 62L952 77L937 92L922 77Z"/><text class="dg-gate-label" x="937" y="104"><tspan x="937" dy="0">gate</tspan></text></g></g><g transform="translate(18 162)"><g class="dg-data"><rect x="0" y="0" width="16" height="12" rx="6"/></g><text class="dg-legend-text" x="22" y="10">Input or result</text><g class="dg-model"><rect x="134" y="0" width="16" height="12" rx="3"/></g><text class="dg-legend-text" x="156" y="10">Model call</text><g class="dg-gate"><path d="M245 0L251 6L245 12L239 6Z"/></g><text class="dg-legend-text" x="260" y="10">Decision point</text></g></svg>
