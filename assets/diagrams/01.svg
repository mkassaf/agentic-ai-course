<svg xmlns="http://www.w3.org/2000/svg" class="dg" role="img" viewBox="0 0 810 178" width="810" height="178"><title>Labelled case (5 tests), then Guided prompt (policy + example), then Model (JSON reply), then Parse (parse_reply()), then Score (pass · fail · invalid), then ≥ 80%.</title><style>text{font-family:"Helvetica Neue",Arial,sans-serif}.dg{display:block;max-width:100%;height:auto;margin:0 auto;overflow:visible;font-family:inherit}.dg rect{stroke-width:1.2}.dg-title{font-size:12.5px;font-weight:600;text-anchor:middle;fill:#1a1a1a}.dg-sub{font-family:"SF Mono",Consolas,monospace;font-size:10px;text-anchor:middle;fill:#5c5c5c}.dg-data rect{fill:#fff;stroke:#9aa5b1;stroke-dasharray:4 3}.dg-code rect{fill:#fff;stroke:#c9d2da}.dg-model rect{fill:#1a1a1a;stroke:#1a1a1a}.dg-model .dg-title{fill:#fff}.dg-model .dg-sub{fill:#c6ced6}.dg-dot{fill:#14a800}.dg-check rect{fill:#fff;stroke:#1a1a1a;stroke-width:1.6}.dg-human rect{fill:#e8f5e4;stroke:#14a800}.dg-gate path{fill:#fff;stroke:#1a1a1a;stroke-width:1.6}.dg-gate-label{font-size:10.5px;font-weight:600;text-anchor:middle;fill:#1a1a1a}.dg-edge{fill:none;stroke:#7b8794;stroke-width:1.3}.dg marker path{fill:#7b8794}.dg-exit{stroke-dasharray:3 3}.dg-loop{stroke:#108a00;stroke-dasharray:5 3}.dg-edge-label,.dg-exit-label,.dg-loop-label{font-size:10.5px;fill:#5c5c5c;text-anchor:middle}.dg-loop-label{fill:#108a00;font-weight:600}.dg-start{text-anchor:start}.dg-end{text-anchor:end}.dg-legend-text{font-size:11px;fill:#5c5c5c}</style><rect width="810" height="178" rx="12" fill="#f3f5f7"/><defs><marker id="arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L8 4L0 8Z"/></marker></defs><g transform="translate(18 18)"><path class="dg-edge" d="M120 70H148" marker-end="url(#arrow)"/><path class="dg-edge" d="M268 70H296" marker-end="url(#arrow)"/><path class="dg-edge" d="M416 70H444" marker-end="url(#arrow)"/><path class="dg-edge" d="M564 70H592" marker-end="url(#arrow)"/><path class="dg-edge" d="M712 70H740" marker-end="url(#arrow)"/><path class="dg-edge dg-exit" d="M505 41V22" marker-end="url(#arrow)"/><text class="dg-exit-label" x="505" y="16">bad format → invalid</text><path class="dg-edge dg-exit" d="M757 55V22" marker-end="url(#arrow)"/><text class="dg-exit-label" x="757" y="16">below → stop</text><g class="dg-data"><rect x="2" y="41" width="118" height="58" rx="22"/><text class="dg-title" x="61" y="67">Labelled case</text><text class="dg-sub" x="61" y="81">5 tests</text></g><g class="dg-code"><rect x="150" y="41" width="118" height="58" rx="8"/><text class="dg-title" x="209" y="67">Guided prompt</text><text class="dg-sub" x="209" y="81">policy + example</text></g><g class="dg-model"><rect x="298" y="41" width="118" height="58" rx="8"/><circle class="dg-dot" cx="407" cy="50" r="3"/><text class="dg-title" x="357" y="67">Model</text><text class="dg-sub" x="357" y="81">JSON reply</text></g><g class="dg-check"><rect x="446" y="41" width="118" height="58" rx="8"/><text class="dg-title" x="505" y="67">Parse</text><text class="dg-sub" x="505" y="81">parse_reply()</text></g><g class="dg-check"><rect x="594" y="40" width="118" height="60" rx="8"/><text class="dg-title" x="653" y="60">Score</text><text class="dg-sub" x="653" y="74">pass · fail ·</text><text class="dg-sub" x="653" y="87">invalid</text></g><g class="dg-gate"><title>≥ 80%</title><path d="M757 55L772 70L757 85L742 70Z"/><text class="dg-gate-label" x="757" y="97"><tspan x="757" dy="0">≥ 80%</tspan></text></g></g><g transform="translate(18 148)"><g class="dg-data"><rect x="0" y="0" width="16" height="12" rx="6"/></g><text class="dg-legend-text" x="22" y="10">Input or result</text><g class="dg-code"><rect x="134" y="0" width="16" height="12" rx="3"/></g><text class="dg-legend-text" x="156" y="10">Plain Python</text><g class="dg-model"><rect x="250" y="0" width="16" height="12" rx="3"/></g><text class="dg-legend-text" x="272" y="10">Model call</text><g class="dg-check"><rect x="354" y="0" width="16" height="12" rx="3"/></g><text class="dg-legend-text" x="376" y="10">Check</text><g class="dg-gate"><path d="M435 0L441 6L435 12L429 6Z"/></g><text class="dg-legend-text" x="450" y="10">Decision point</text></g></svg>
