<svg xmlns="http://www.w3.org/2000/svg" class="dg" role="img" viewBox="0 0 662 192" width="662" height="192"><title>Provider payload (synthetic payment), then Discover Agent Card (official A2A SDK), then Payment adapter (validate and translate), then valid?, then Internal Payment (Money value + order ID).</title><style>text{font-family:"Helvetica Neue",Arial,sans-serif}.dg{display:block;max-width:100%;height:auto;margin:0 auto;overflow:visible;font-family:inherit}.dg rect{stroke-width:1.2}.dg-title{font-size:12.5px;font-weight:600;text-anchor:middle;fill:#1a1a1a}.dg-sub{font-family:"SF Mono",Consolas,monospace;font-size:10px;text-anchor:middle;fill:#5c5c5c}.dg-data rect{fill:#fff;stroke:#9aa5b1;stroke-dasharray:4 3}.dg-code rect{fill:#fff;stroke:#c9d2da}.dg-model rect{fill:#1a1a1a;stroke:#1a1a1a}.dg-model .dg-title{fill:#fff}.dg-model .dg-sub{fill:#c6ced6}.dg-dot{fill:#14a800}.dg-check rect{fill:#fff;stroke:#1a1a1a;stroke-width:1.6}.dg-human rect{fill:#e8f5e4;stroke:#14a800}.dg-gate path{fill:#fff;stroke:#1a1a1a;stroke-width:1.6}.dg-gate-label{font-size:10.5px;font-weight:600;text-anchor:middle;fill:#1a1a1a}.dg-edge{fill:none;stroke:#7b8794;stroke-width:1.3}.dg marker path{fill:#7b8794}.dg-exit{stroke-dasharray:3 3}.dg-loop{stroke:#108a00;stroke-dasharray:5 3}.dg-edge-label,.dg-exit-label,.dg-loop-label{font-size:10.5px;fill:#5c5c5c;text-anchor:middle}.dg-loop-label{fill:#108a00;font-weight:600}.dg-start{text-anchor:start}.dg-end{text-anchor:end}.dg-legend-text{font-size:11px;fill:#5c5c5c}</style><rect width="662" height="192" rx="12" fill="#f3f5f7"/><defs><marker id="arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L8 4L0 8Z"/></marker></defs><g transform="translate(18 18)"><path class="dg-edge" d="M120 77H148" marker-end="url(#arrow)"/><path class="dg-edge" d="M268 77H296" marker-end="url(#arrow)"/><path class="dg-edge" d="M416 77H444" marker-end="url(#arrow)"/><path class="dg-edge" d="M476 77H504" marker-end="url(#arrow)"/><path class="dg-edge dg-exit" d="M461 62V22" marker-end="url(#arrow)"/><text class="dg-exit-label" x="461" y="16">bad → error</text><g class="dg-data"><rect x="2" y="47" width="118" height="60" rx="22"/><text class="dg-title" x="61" y="67">Provider</text><text class="dg-title" x="61" y="81">payload</text><text class="dg-sub" x="61" y="95">synthetic payment</text></g><g class="dg-code"><rect x="150" y="47" width="118" height="60" rx="8"/><text class="dg-title" x="209" y="67">Discover Agent</text><text class="dg-title" x="209" y="81">Card</text><text class="dg-sub" x="209" y="95">official A2A SDK</text></g><g class="dg-code"><rect x="298" y="47" width="118" height="60" rx="8"/><text class="dg-title" x="357" y="67">Payment adapter</text><text class="dg-sub" x="357" y="81">validate and</text><text class="dg-sub" x="357" y="94">translate</text></g><g class="dg-gate"><title>valid?</title><path d="M461 62L476 77L461 92L446 77Z"/><text class="dg-gate-label" x="461" y="104"><tspan x="461" dy="0">valid?</tspan></text></g><g class="dg-data"><rect x="506" y="40" width="118" height="74" rx="22"/><text class="dg-title" x="565" y="60">Internal</text><text class="dg-title" x="565" y="74">Payment</text><text class="dg-sub" x="565" y="88">Money value +</text><text class="dg-sub" x="565" y="101">order ID</text></g></g><g transform="translate(18 162)"><g class="dg-data"><rect x="0" y="0" width="16" height="12" rx="6"/></g><text class="dg-legend-text" x="22" y="10">Input or result</text><g class="dg-code"><rect x="134" y="0" width="16" height="12" rx="3"/></g><text class="dg-legend-text" x="156" y="10">Plain Python</text><g class="dg-gate"><path d="M257 0L263 6L257 12L251 6Z"/></g><text class="dg-legend-text" x="272" y="10">Decision point</text></g></svg>
