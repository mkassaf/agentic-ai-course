<svg xmlns="http://www.w3.org/2000/svg" class="dg" role="img" viewBox="0 0 898 314" width="898" height="314"><title>Minimalist (model agent) or Modernizer (model agent) or Rulebook (added in one line), then Schema check (structured message), then Write the log (JSON + trace_id), then Live log (same JSON lines) or council.log (one JSON per line) or LangSmith (trace tree (optional)), then Chair (majority or escalate), then Evidence trail (ids from council.log).</title><style>text{font-family:"Helvetica Neue",Arial,sans-serif}.dg{display:block;max-width:100%;height:auto;margin:0 auto;overflow:visible;font-family:inherit}.dg rect{stroke-width:1.2}.dg-title{font-size:12.5px;font-weight:600;text-anchor:middle;fill:#1a1a1a}.dg-sub{font-family:"SF Mono",Consolas,monospace;font-size:10px;text-anchor:middle;fill:#5c5c5c}.dg-data rect{fill:#fff;stroke:#9aa5b1;stroke-dasharray:4 3}.dg-code rect{fill:#fff;stroke:#c9d2da}.dg-model rect{fill:#1a1a1a;stroke:#1a1a1a}.dg-model .dg-title{fill:#fff}.dg-model .dg-sub{fill:#c6ced6}.dg-dot{fill:#14a800}.dg-check rect{fill:#fff;stroke:#1a1a1a;stroke-width:1.6}.dg-human rect{fill:#e8f5e4;stroke:#14a800}.dg-gate path{fill:#fff;stroke:#1a1a1a;stroke-width:1.6}.dg-gate-label{font-size:10.5px;font-weight:600;text-anchor:middle;fill:#1a1a1a}.dg-edge{fill:none;stroke:#7b8794;stroke-width:1.3}.dg marker path{fill:#7b8794}.dg-exit{stroke-dasharray:3 3}.dg-loop{stroke:#108a00;stroke-dasharray:5 3}.dg-edge-label,.dg-exit-label,.dg-loop-label{font-size:10.5px;fill:#5c5c5c;text-anchor:middle}.dg-loop-label{fill:#108a00;font-weight:600}.dg-start{text-anchor:start}.dg-end{text-anchor:end}.dg-legend-text{font-size:11px;fill:#5c5c5c}</style><rect width="898" height="314" rx="12" fill="#f3f5f7"/><defs><marker id="arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L8 4L0 8Z"/></marker></defs><g transform="translate(18 18)"><path class="dg-edge" d="M120 70H135V138H148" marker-end="url(#arrow)"/><path class="dg-edge" d="M120 138H148" marker-end="url(#arrow)"/><path class="dg-edge" d="M120 206H135V138H148" marker-end="url(#arrow)"/><path class="dg-edge" d="M268 138H296" marker-end="url(#arrow)"/><path class="dg-edge" d="M416 138H431V69H444" marker-end="url(#arrow)"/><path class="dg-edge" d="M416 138H431V137H444" marker-end="url(#arrow)"/><path class="dg-edge" d="M416 138H431V206H444" marker-end="url(#arrow)"/><path class="dg-edge" d="M564 69H579V138H592" marker-end="url(#arrow)"/><path class="dg-edge" d="M564 137H579V138H592" marker-end="url(#arrow)"/><path class="dg-edge" d="M564 206H579V138H592" marker-end="url(#arrow)"/><path class="dg-edge" d="M712 138H740" marker-end="url(#arrow)"/><path class="dg-edge dg-exit" d="M209 108V22" marker-end="url(#arrow)"/><text class="dg-exit-label" x="209" y="16">broken → rejected</text><g class="dg-model"><rect x="2" y="41" width="118" height="58" rx="8"/><circle class="dg-dot" cx="111" cy="50" r="3"/><text class="dg-title" x="61" y="67">Minimalist</text><text class="dg-sub" x="61" y="81">model agent</text></g><g class="dg-model"><rect x="2" y="109" width="118" height="58" rx="8"/><circle class="dg-dot" cx="111" cy="118" r="3"/><text class="dg-title" x="61" y="135">Modernizer</text><text class="dg-sub" x="61" y="149">model agent</text></g><g class="dg-code"><rect x="2" y="177" width="118" height="58" rx="8"/><text class="dg-title" x="61" y="203">Rulebook</text><text class="dg-sub" x="61" y="217">added in one line</text></g><g class="dg-check"><rect x="150" y="108" width="118" height="60" rx="8"/><text class="dg-title" x="209" y="128">Schema check</text><text class="dg-sub" x="209" y="142">structured</text><text class="dg-sub" x="209" y="155">message</text></g><g class="dg-code"><rect x="298" y="109" width="118" height="58" rx="8"/><text class="dg-title" x="357" y="135">Write the log</text><text class="dg-sub" x="357" y="149">JSON + trace_id</text></g><g class="dg-data"><rect x="446" y="40" width="118" height="58" rx="22"/><text class="dg-title" x="505" y="66">Live log</text><text class="dg-sub" x="505" y="80">same JSON lines</text></g><g class="dg-data"><rect x="446" y="108" width="118" height="58" rx="22"/><text class="dg-title" x="505" y="134">council.log</text><text class="dg-sub" x="505" y="148">one JSON per line</text></g><g class="dg-data"><rect x="446" y="176" width="118" height="60" rx="22"/><text class="dg-title" x="505" y="196">LangSmith</text><text class="dg-sub" x="505" y="210">trace tree</text><text class="dg-sub" x="505" y="223">(optional)</text></g><g class="dg-check"><rect x="594" y="108" width="118" height="60" rx="8"/><text class="dg-title" x="653" y="128">Chair</text><text class="dg-sub" x="653" y="142">majority or</text><text class="dg-sub" x="653" y="155">escalate</text></g><g class="dg-data"><rect x="742" y="108" width="118" height="60" rx="22"/><text class="dg-title" x="801" y="128">Evidence trail</text><text class="dg-sub" x="801" y="142">ids from</text><text class="dg-sub" x="801" y="155">council.log</text></g></g><g transform="translate(18 284)"><g class="dg-data"><rect x="0" y="0" width="16" height="12" rx="6"/></g><text class="dg-legend-text" x="22" y="10">Input or result</text><g class="dg-code"><rect x="134" y="0" width="16" height="12" rx="3"/></g><text class="dg-legend-text" x="156" y="10">Plain Python</text><g class="dg-model"><rect x="250" y="0" width="16" height="12" rx="3"/></g><text class="dg-legend-text" x="272" y="10">Model call</text><g class="dg-check"><rect x="354" y="0" width="16" height="12" rx="3"/></g><text class="dg-legend-text" x="376" y="10">Check</text></g></svg>
