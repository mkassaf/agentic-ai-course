<svg xmlns="http://www.w3.org/2000/svg" class="dg" role="img" viewBox="0 0 937.2 180" width="937.2" height="180"><title>Council proposal (microservices 2–1), then Human review (verdict + reason), then Council revises (reads short-term notes), then Long-term memory (lesson in Chroma), then Recall (similar new cases), then Held-out score (before vs after). Then back to Human review: at most 2 reviews.</title><style>text{font-family:"Helvetica Neue",Arial,sans-serif}.dg{display:block;max-width:100%;height:auto;margin:0 auto;overflow:visible;font-family:inherit}.dg rect{stroke-width:1.2}.dg-title{font-size:12.5px;font-weight:600;text-anchor:middle;fill:#1a1a1a}.dg-sub{font-family:"SF Mono",Consolas,monospace;font-size:10px;text-anchor:middle;fill:#5c5c5c}.dg-data rect{fill:#fff;stroke:#9aa5b1;stroke-dasharray:4 3}.dg-code rect{fill:#fff;stroke:#c9d2da}.dg-model rect{fill:#1a1a1a;stroke:#1a1a1a}.dg-model .dg-title{fill:#fff}.dg-model .dg-sub{fill:#c6ced6}.dg-dot{fill:#14a800}.dg-check rect{fill:#fff;stroke:#1a1a1a;stroke-width:1.6}.dg-human rect{fill:#e8f5e4;stroke:#14a800}.dg-gate path{fill:#fff;stroke:#1a1a1a;stroke-width:1.6}.dg-gate-label{font-size:10.5px;font-weight:600;text-anchor:middle;fill:#1a1a1a}.dg-edge{fill:none;stroke:#7b8794;stroke-width:1.3}.dg marker path{fill:#7b8794}.dg-exit{stroke-dasharray:3 3}.dg-loop{stroke:#108a00;stroke-dasharray:5 3}.dg-edge-label,.dg-exit-label,.dg-loop-label{font-size:10.5px;fill:#5c5c5c;text-anchor:middle}.dg-loop-label{fill:#108a00;font-weight:600}.dg-start{text-anchor:start}.dg-end{text-anchor:end}.dg-legend-text{font-size:11px;fill:#5c5c5c}</style><rect width="937.2" height="180" rx="12" fill="#f3f5f7"/><defs><marker id="arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L8 4L0 8Z"/></marker></defs><g transform="translate(18 18)"><path class="dg-edge" d="M120 36H148" marker-end="url(#arrow)"/><path class="dg-edge" d="M268 36H315.6" marker-end="url(#arrow)"/><text class="dg-edge-label" x="292.8" y="28">reject</text><path class="dg-edge" d="M435.6 36H483.20000000000005" marker-end="url(#arrow)"/><text class="dg-edge-label" x="460.40000000000003" y="28">accept</text><path class="dg-edge" d="M603.2 36H631.2" marker-end="url(#arrow)"/><path class="dg-edge" d="M751.2 36H779.2" marker-end="url(#arrow)"/><path class="dg-edge dg-loop" d="M376.6 66V88H209V67" marker-end="url(#arrow)"/><text class="dg-loop-label" x="292.8" y="102">at most 2 reviews</text><g class="dg-data"><rect x="2" y="6" width="118" height="60" rx="22"/><text class="dg-title" x="61" y="26">Council</text><text class="dg-title" x="61" y="40">proposal</text><text class="dg-sub" x="61" y="54">microservices 2–1</text></g><g class="dg-human"><rect x="150" y="7" width="118" height="58" rx="8"/><text class="dg-title" x="209" y="33">Human review</text><text class="dg-sub" x="209" y="47">verdict + reason</text></g><g class="dg-model"><rect x="317.6" y="6" width="118" height="60" rx="8"/><circle class="dg-dot" cx="426.6" cy="15" r="3"/><text class="dg-title" x="376.6" y="26">Council revises</text><text class="dg-sub" x="376.6" y="40">reads short-term</text><text class="dg-sub" x="376.6" y="53">notes</text></g><g class="dg-code"><rect x="485.20000000000005" y="6" width="118" height="60" rx="8"/><text class="dg-title" x="544.2" y="26">Long-term</text><text class="dg-title" x="544.2" y="40">memory</text><text class="dg-sub" x="544.2" y="54">lesson in Chroma</text></g><g class="dg-code"><rect x="633.2" y="7" width="118" height="58" rx="8"/><text class="dg-title" x="692.2" y="33">Recall</text><text class="dg-sub" x="692.2" y="47">similar new cases</text></g><g class="dg-check"><rect x="781.2" y="7" width="118" height="58" rx="8"/><text class="dg-title" x="840.2" y="33">Held-out score</text><text class="dg-sub" x="840.2" y="47">before vs after</text></g></g><g transform="translate(18 150)"><g class="dg-data"><rect x="0" y="0" width="16" height="12" rx="6"/></g><text class="dg-legend-text" x="22" y="10">Input or result</text><g class="dg-code"><rect x="134" y="0" width="16" height="12" rx="3"/></g><text class="dg-legend-text" x="156" y="10">Plain Python</text><g class="dg-model"><rect x="250" y="0" width="16" height="12" rx="3"/></g><text class="dg-legend-text" x="272" y="10">Model call</text><g class="dg-check"><rect x="354" y="0" width="16" height="12" rx="3"/></g><text class="dg-legend-text" x="376" y="10">Check</text><g class="dg-human"><rect x="428" y="0" width="16" height="12" rx="3"/></g><text class="dg-legend-text" x="450" y="10">Human</text></g></svg>
