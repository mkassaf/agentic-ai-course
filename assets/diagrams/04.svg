<svg xmlns="http://www.w3.org/2000/svg" class="dg" role="img" viewBox="0 0 898 244" width="898" height="244"><title>Request, then Pick a tool ({&quot;tool&quot;, &quot;args&quot;}), then call_tool() (name · types), then User confirms (write tools only), then search_hotels() (reads live data) or book_room() (changes data), then Answer (from the result).</title><style>text{font-family:"Helvetica Neue",Arial,sans-serif}.dg{display:block;max-width:100%;height:auto;margin:0 auto;overflow:visible;font-family:inherit}.dg rect{stroke-width:1.2}.dg-title{font-size:12.5px;font-weight:600;text-anchor:middle;fill:#1a1a1a}.dg-sub{font-family:"SF Mono",Consolas,monospace;font-size:10px;text-anchor:middle;fill:#5c5c5c}.dg-data rect{fill:#fff;stroke:#9aa5b1;stroke-dasharray:4 3}.dg-code rect{fill:#fff;stroke:#c9d2da}.dg-model rect{fill:#1a1a1a;stroke:#1a1a1a}.dg-model .dg-title{fill:#fff}.dg-model .dg-sub{fill:#c6ced6}.dg-dot{fill:#14a800}.dg-check rect{fill:#fff;stroke:#1a1a1a;stroke-width:1.6}.dg-human rect{fill:#e8f5e4;stroke:#14a800}.dg-gate path{fill:#fff;stroke:#1a1a1a;stroke-width:1.6}.dg-gate-label{font-size:10.5px;font-weight:600;text-anchor:middle;fill:#1a1a1a}.dg-edge{fill:none;stroke:#7b8794;stroke-width:1.3}.dg marker path{fill:#7b8794}.dg-exit{stroke-dasharray:3 3}.dg-loop{stroke:#108a00;stroke-dasharray:5 3}.dg-edge-label,.dg-exit-label,.dg-loop-label{font-size:10.5px;fill:#5c5c5c;text-anchor:middle}.dg-loop-label{fill:#108a00;font-weight:600}.dg-start{text-anchor:start}.dg-end{text-anchor:end}.dg-legend-text{font-size:11px;fill:#5c5c5c}</style><rect width="898" height="244" rx="12" fill="#f3f5f7"/><defs><marker id="arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L8 4L0 8Z"/></marker></defs><g transform="translate(18 18)"><path class="dg-edge" d="M120 103H148" marker-end="url(#arrow)"/><path class="dg-edge" d="M268 103H296" marker-end="url(#arrow)"/><path class="dg-edge" d="M416 103H444" marker-end="url(#arrow)"/><path class="dg-edge" d="M564 103H579V69H592" marker-end="url(#arrow)"/><path class="dg-edge" d="M564 103H579V137H592" marker-end="url(#arrow)"/><path class="dg-edge" d="M712 69H727V103H740" marker-end="url(#arrow)"/><path class="dg-edge" d="M712 137H727V103H740" marker-end="url(#arrow)"/><path class="dg-edge dg-exit" d="M357 74V22" marker-end="url(#arrow)"/><text class="dg-exit-label" x="357" y="16">bad → error as data</text><g class="dg-data"><rect x="2" y="74" width="118" height="58" rx="22"/><text class="dg-title" x="61" y="107">Request</text></g><g class="dg-model"><rect x="150" y="74" width="118" height="58" rx="8"/><circle class="dg-dot" cx="259" cy="83" r="3"/><text class="dg-title" x="209" y="100">Pick a tool</text><text class="dg-sub" x="209" y="114">{&quot;tool&quot;, &quot;args&quot;}</text></g><g class="dg-check"><rect x="298" y="74" width="118" height="58" rx="8"/><text class="dg-title" x="357" y="100">call_tool()</text><text class="dg-sub" x="357" y="114">name · types</text></g><g class="dg-human"><rect x="446" y="74" width="118" height="58" rx="8"/><text class="dg-title" x="505" y="100">User confirms</text><text class="dg-sub" x="505" y="114">write tools only</text></g><g class="dg-code"><rect x="594" y="40" width="118" height="58" rx="8"/><text class="dg-title" x="653" y="66">search_hotels()</text><text class="dg-sub" x="653" y="80">reads live data</text></g><g class="dg-code"><rect x="594" y="108" width="118" height="58" rx="8"/><text class="dg-title" x="653" y="134">book_room()</text><text class="dg-sub" x="653" y="148">changes data</text></g><g class="dg-model"><rect x="742" y="74" width="118" height="58" rx="8"/><circle class="dg-dot" cx="851" cy="83" r="3"/><text class="dg-title" x="801" y="100">Answer</text><text class="dg-sub" x="801" y="114">from the result</text></g></g><g transform="translate(18 214)"><g class="dg-data"><rect x="0" y="0" width="16" height="12" rx="6"/></g><text class="dg-legend-text" x="22" y="10">Input or result</text><g class="dg-code"><rect x="134" y="0" width="16" height="12" rx="3"/></g><text class="dg-legend-text" x="156" y="10">Plain Python</text><g class="dg-model"><rect x="250" y="0" width="16" height="12" rx="3"/></g><text class="dg-legend-text" x="272" y="10">Model call</text><g class="dg-check"><rect x="354" y="0" width="16" height="12" rx="3"/></g><text class="dg-legend-text" x="376" y="10">Check</text><g class="dg-human"><rect x="428" y="0" width="16" height="12" rx="3"/></g><text class="dg-legend-text" x="450" y="10">Human</text></g></svg>
