<svg xmlns="http://www.w3.org/2000/svg" class="dg" role="img" viewBox="0 0 750 144" width="750" height="144"><title>Skill catalog (names + descriptions), then Pick a skill (name only), then Load instructions (SKILL.md body), then Write the ADR (per case), then Check the ADR (adr_problems()).</title><style>text{font-family:"Helvetica Neue",Arial,sans-serif}.dg{display:block;max-width:100%;height:auto;margin:0 auto;overflow:visible;font-family:inherit}.dg rect{stroke-width:1.2}.dg-title{font-size:12.5px;font-weight:600;text-anchor:middle;fill:#1a1a1a}.dg-sub{font-family:"SF Mono",Consolas,monospace;font-size:10px;text-anchor:middle;fill:#5c5c5c}.dg-data rect{fill:#fff;stroke:#9aa5b1;stroke-dasharray:4 3}.dg-code rect{fill:#fff;stroke:#c9d2da}.dg-model rect{fill:#1a1a1a;stroke:#1a1a1a}.dg-model .dg-title{fill:#fff}.dg-model .dg-sub{fill:#c6ced6}.dg-dot{fill:#14a800}.dg-check rect{fill:#fff;stroke:#1a1a1a;stroke-width:1.6}.dg-human rect{fill:#e8f5e4;stroke:#14a800}.dg-gate path{fill:#fff;stroke:#1a1a1a;stroke-width:1.6}.dg-gate-label{font-size:10.5px;font-weight:600;text-anchor:middle;fill:#1a1a1a}.dg-edge{fill:none;stroke:#7b8794;stroke-width:1.3}.dg marker path{fill:#7b8794}.dg-exit{stroke-dasharray:3 3}.dg-loop{stroke:#108a00;stroke-dasharray:5 3}.dg-edge-label,.dg-exit-label,.dg-loop-label{font-size:10.5px;fill:#5c5c5c;text-anchor:middle}.dg-loop-label{fill:#108a00;font-weight:600}.dg-start{text-anchor:start}.dg-end{text-anchor:end}.dg-legend-text{font-size:11px;fill:#5c5c5c}</style><rect width="750" height="144" rx="12" fill="#f3f5f7"/><defs><marker id="arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L8 4L0 8Z"/></marker></defs><g transform="translate(18 18)"><path class="dg-edge" d="M120 36H148" marker-end="url(#arrow)"/><path class="dg-edge" d="M268 36H296" marker-end="url(#arrow)"/><path class="dg-edge" d="M416 36H444" marker-end="url(#arrow)"/><path class="dg-edge" d="M564 36H592" marker-end="url(#arrow)"/><g class="dg-data"><rect x="2" y="6" width="118" height="60" rx="22"/><text class="dg-title" x="61" y="26">Skill catalog</text><text class="dg-sub" x="61" y="40">names +</text><text class="dg-sub" x="61" y="53">descriptions</text></g><g class="dg-model"><rect x="150" y="7" width="118" height="58" rx="8"/><circle class="dg-dot" cx="259" cy="16" r="3"/><text class="dg-title" x="209" y="33">Pick a skill</text><text class="dg-sub" x="209" y="47">name only</text></g><g class="dg-code"><rect x="298" y="6" width="118" height="60" rx="8"/><text class="dg-title" x="357" y="26">Load</text><text class="dg-title" x="357" y="40">instructions</text><text class="dg-sub" x="357" y="54">SKILL.md body</text></g><g class="dg-model"><rect x="446" y="7" width="118" height="58" rx="8"/><circle class="dg-dot" cx="555" cy="16" r="3"/><text class="dg-title" x="505" y="33">Write the ADR</text><text class="dg-sub" x="505" y="47">per case</text></g><g class="dg-check"><rect x="594" y="7" width="118" height="58" rx="8"/><text class="dg-title" x="653" y="33">Check the ADR</text><text class="dg-sub" x="653" y="47">adr_problems()</text></g></g><g transform="translate(18 114)"><g class="dg-data"><rect x="0" y="0" width="16" height="12" rx="6"/></g><text class="dg-legend-text" x="22" y="10">Input or result</text><g class="dg-code"><rect x="134" y="0" width="16" height="12" rx="3"/></g><text class="dg-legend-text" x="156" y="10">Plain Python</text><g class="dg-model"><rect x="250" y="0" width="16" height="12" rx="3"/></g><text class="dg-legend-text" x="272" y="10">Model call</text><g class="dg-check"><rect x="354" y="0" width="16" height="12" rx="3"/></g><text class="dg-legend-text" x="376" y="10">Check</text></g></svg>
