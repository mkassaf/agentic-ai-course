<svg xmlns="http://www.w3.org/2000/svg" class="dg" role="img" viewBox="0 0 670.4 178" width="670.4" height="178"><title>START, then choose (node), then check (node), then route, then END. Then back to choose: retry · at most 2 attempts.</title><style>text{font-family:"Helvetica Neue",Arial,sans-serif}.dg{display:block;max-width:100%;height:auto;margin:0 auto;overflow:visible;font-family:inherit}.dg rect{stroke-width:1.2}.dg-title{font-size:12.5px;font-weight:600;text-anchor:middle;fill:#1a1a1a}.dg-sub{font-family:"SF Mono",Consolas,monospace;font-size:10px;text-anchor:middle;fill:#5c5c5c}.dg-data rect{fill:#fff;stroke:#9aa5b1;stroke-dasharray:4 3}.dg-code rect{fill:#fff;stroke:#c9d2da}.dg-model rect{fill:#1a1a1a;stroke:#1a1a1a}.dg-model .dg-title{fill:#fff}.dg-model .dg-sub{fill:#c6ced6}.dg-dot{fill:#14a800}.dg-check rect{fill:#fff;stroke:#1a1a1a;stroke-width:1.6}.dg-human rect{fill:#e8f5e4;stroke:#14a800}.dg-gate path{fill:#fff;stroke:#1a1a1a;stroke-width:1.6}.dg-gate-label{font-size:10.5px;font-weight:600;text-anchor:middle;fill:#1a1a1a}.dg-edge{fill:none;stroke:#7b8794;stroke-width:1.3}.dg marker path{fill:#7b8794}.dg-exit{stroke-dasharray:3 3}.dg-loop{stroke:#108a00;stroke-dasharray:5 3}.dg-edge-label,.dg-exit-label,.dg-loop-label{font-size:10.5px;fill:#5c5c5c;text-anchor:middle}.dg-loop-label{fill:#108a00;font-weight:600}.dg-start{text-anchor:start}.dg-end{text-anchor:end}.dg-legend-text{font-size:11px;fill:#5c5c5c}</style><rect width="670.4" height="178" rx="12" fill="#f3f5f7"/><defs><marker id="arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L8 4L0 8Z"/></marker></defs><g transform="translate(18 18)"><path class="dg-edge" d="M120 35H148" marker-end="url(#arrow)"/><path class="dg-edge" d="M268 35H296" marker-end="url(#arrow)"/><path class="dg-edge" d="M416 35H444" marker-end="url(#arrow)"/><path class="dg-edge" d="M476 35H512.4" marker-end="url(#arrow)"/><text class="dg-edge-label" x="495.2" y="27">done</text><path class="dg-edge dg-loop" d="M461 50V86H209V66" marker-end="url(#arrow)"/><text class="dg-loop-label" x="335" y="100">retry · at most 2 attempts</text><g class="dg-data"><rect x="2" y="6" width="118" height="58" rx="22"/><text class="dg-title" x="61" y="39">START</text></g><g class="dg-model"><rect x="150" y="6" width="118" height="58" rx="8"/><circle class="dg-dot" cx="259" cy="15" r="3"/><text class="dg-title" x="209" y="32">choose</text><text class="dg-sub" x="209" y="46">node</text></g><g class="dg-check"><rect x="298" y="6" width="118" height="58" rx="8"/><text class="dg-title" x="357" y="32">check</text><text class="dg-sub" x="357" y="46">node</text></g><g class="dg-gate"><title>route</title><path d="M461 20L476 35L461 50L446 35Z"/><text class="dg-gate-label" x="461" y="62"><tspan x="461" dy="0">route</tspan></text></g><g class="dg-data"><rect x="514.4" y="6" width="118" height="58" rx="22"/><text class="dg-title" x="573.4" y="39">END</text></g></g><g transform="translate(18 148)"><g class="dg-data"><rect x="0" y="0" width="16" height="12" rx="6"/></g><text class="dg-legend-text" x="22" y="10">Input or result</text><g class="dg-model"><rect x="134" y="0" width="16" height="12" rx="3"/></g><text class="dg-legend-text" x="156" y="10">Model call</text><g class="dg-check"><rect x="238" y="0" width="16" height="12" rx="3"/></g><text class="dg-legend-text" x="260" y="10">Check</text><g class="dg-gate"><path d="M319 0L325 6L319 12L313 6Z"/></g><text class="dg-legend-text" x="334" y="10">Decision point</text></g></svg>
