<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1020" role="img" aria-labelledby="title desc">
<title id="title">How temperature, top-k, and top-p choose a next token</title>
<desc id="desc">A four-token illustrative example: scores 2, 1, 0, and minus 1. Temperature 2 produces probabilities 45.51%, 27.60%, 16.74%, and 10.15%. Top-k 3 removes D and renormalizes the rest to 50.65%, 30.72%, and 18.63%. Top-p 0.80 keeps A and B, whose cumulative probability is 81.37%. The final probabilities are 62.25% for A and 37.75% for B; one is sampled. This is one possible processing order.</desc>
<style>
  text { font-family: "Helvetica Neue", Arial, sans-serif; fill: #1a1a1a; }
  .title { font-size: 43px; font-weight: 700; }
  .intro { font-size: 23px; fill: #5c5c5c; }
  .pill { font-size: 20px; font-weight: 700; }
  .card { fill: white; stroke: #d4dbe2; stroke-width: 2; }
  .number { font-size: 22px; font-weight: 700; }
  .card-title { font-size: 27px; font-weight: 700; }
  .subtitle { font-size: 20px; fill: #5c5c5c; }
  .token { font-size: 22px; font-weight: 700; }
  .value { font-size: 27px; font-weight: 600; }
  .removed { font-size: 20px; fill: #798086; }
  .body { font-size: 22px; }
  .note { font-size: 20px; fill: #5c5c5c; }
  .large { font-size: 37px; font-weight: 700; }
</style>
<defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0 0 L9 4.5 L0 9 Z" fill="#798086"/></marker></defs>
<rect width="1600" height="1020" rx="26" fill="#f3f5f7"/>
<text x="50" y="66" class="title" text-anchor="start">How sampling chooses the next token</text>
<text x="50" y="106" class="intro" text-anchor="start">A worked example: temperature → top-k → top-p → sample</text>
<rect x="50" y="131" width="455" height="48" rx="24" fill="#e0e6eb"/>
<text x="70" y="162" class="pill" text-anchor="start">T = 2.0  ·  top-k = 3  ·  top-p = 0.80</text>
<text x="535" y="162" class="intro" text-anchor="start">Four illustrative candidates, not actual model scores</text>
<path d="M520 355 H548" stroke="#798086" stroke-width="3" fill="none" marker-end="url(#arrow)"/>
<path d="M1040 355 H1068" stroke="#798086" stroke-width="3" fill="none" marker-end="url(#arrow)"/>
<path d="M1320 505 V545 H390 V558" stroke="#798086" stroke-width="3" fill="none" marker-end="url(#arrow)"/>
<path d="M770 720 H810" stroke="#798086" stroke-width="3" fill="none" marker-end="url(#arrow)"/>
<rect x="40" y="205" width="480" height="300" rx="18" class="card"/>
<circle cx="77" cy="248" r="19" fill="#14a800"/>
<text x="77" y="255" class="number" text-anchor="middle">1</text>
<text x="110" y="257" class="card-title" text-anchor="start">Model scores</text>
<text x="65" y="305" class="subtitle" text-anchor="start">Four candidate next tokens</text>
<text x="118.75" y="360" class="token" text-anchor="middle">A</text>
<text x="118.75" y="409" class="value" text-anchor="middle">2.0</text>
<text x="226.25" y="360" class="token" text-anchor="middle">B</text>
<text x="226.25" y="409" class="value" text-anchor="middle">1.0</text>
<text x="333.75" y="360" class="token" text-anchor="middle">C</text>
<text x="333.75" y="409" class="value" text-anchor="middle">0.0</text>
<text x="441.25" y="360" class="token" text-anchor="middle">D</text>
<text x="441.25" y="409" class="value" text-anchor="middle">-1.0</text>
<text x="65" y="465" class="note" text-anchor="start">Scores are not probabilities yet.</text>
<rect x="560" y="205" width="480" height="300" rx="18" class="card"/>
<circle cx="597" cy="248" r="19" fill="#14a800"/>
<text x="597" y="255" class="number" text-anchor="middle">2</text>
<text x="630" y="257" class="card-title" text-anchor="start">Temperature = 2</text>
<text x="585" y="305" class="subtitle" text-anchor="start">Divide scores by 2; compute probabilities</text>
<text x="638.75" y="360" class="token" text-anchor="middle">A</text>
<text x="638.75" y="409" class="value" text-anchor="middle">45.51%</text>
<text x="746.25" y="360" class="token" text-anchor="middle">B</text>
<text x="746.25" y="409" class="value" text-anchor="middle">27.60%</text>
<text x="853.75" y="360" class="token" text-anchor="middle">C</text>
<text x="853.75" y="409" class="value" text-anchor="middle">16.74%</text>
<text x="961.25" y="360" class="token" text-anchor="middle">D</text>
<text x="961.25" y="409" class="value" text-anchor="middle">10.15%</text>
<text x="585" y="465" class="note" text-anchor="start">Higher temperature flattens this example.</text>
<rect x="1080" y="205" width="480" height="300" rx="18" class="card"/>
<circle cx="1117" cy="248" r="19" fill="#14a800"/>
<text x="1117" y="255" class="number" text-anchor="middle">3</text>
<text x="1150" y="257" class="card-title" text-anchor="start">Top-k = 3</text>
<text x="1105" y="305" class="subtitle" text-anchor="start">Keep the three highest candidates</text>
<text x="1158.75" y="360" class="token" text-anchor="middle">A</text>
<text x="1158.75" y="409" class="value" text-anchor="middle">50.65%</text>
<text x="1266.25" y="360" class="token" text-anchor="middle">B</text>
<text x="1266.25" y="409" class="value" text-anchor="middle">30.72%</text>
<text x="1373.75" y="360" class="token" text-anchor="middle">C</text>
<text x="1373.75" y="409" class="value" text-anchor="middle">18.63%</text>
<text x="1481.25" y="360" class="token" text-anchor="middle">D</text>
<text x="1481.25" y="409" class="removed" text-anchor="middle">removed</text>
<text x="1105" y="465" class="note" text-anchor="start">D is removed; remaining values are rescaled.</text>
<rect x="40" y="570" width="730" height="300" rx="18" class="card"/>
<circle cx="77" cy="613" r="19" fill="#14a800"/>
<text x="77" y="620" class="number" text-anchor="middle">4</text>
<text x="110" y="622" class="card-title" text-anchor="start">Top-p = 0.80</text>
<text x="65" y="670" class="subtitle" text-anchor="start">Keep the smallest most-likely set reaching 80%</text>
<text x="65" y="743" class="large" text-anchor="start">A 50.65%  +  B 30.72%  =  81.37%</text>
<text x="65" y="805" class="body" text-anchor="start">Keep A and B; remove C. D was already removed.</text>
<rect x="830" y="570" width="730" height="300" rx="18" class="card"/>
<circle cx="867" cy="613" r="19" fill="#14a800"/>
<text x="867" y="620" class="number" text-anchor="middle">5</text>
<text x="900" y="622" class="card-title" text-anchor="start">Sample one token</text>
<text x="855" y="670" class="subtitle" text-anchor="start">Renormalize the surviving candidates</text>
<text x="855" y="743" class="large" text-anchor="start">A  62.25%       B  37.75%</text>
<text x="855" y="805" class="body" text-anchor="start">Sample A or B, then repeat for the next token.</text>
<text x="50" y="931" class="note" text-anchor="start">This shows Transformers sampling with these settings and no other filters. Providers may use a different order or ignore settings.</text>
<text x="50" y="968" class="note" text-anchor="start">The probabilities are illustrative. Temperature zero and greedy decoding are handled separately.</text>
</svg>
