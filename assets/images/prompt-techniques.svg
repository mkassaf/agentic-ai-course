<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 1450" role="img" aria-labelledby="title desc">
<title id="title">Prompting techniques: demonstrations and persona are separate choices</title>
<desc id="desc">Panel A compares three prompts for the same customer message about a missing package. The categories are Billing, Delivery, and Login. Zero-shot gives no examples. One-shot shows a package sent to the wrong address, categorized as Delivery. Few-shot adds a double charge for Billing and a sign-in problem for Login. The expected category is Delivery. Panel B asks both personas which API pattern supports phone and browser clients with different needs and asks for one operational trade-off. The mobile developer is responsible for fast app screens. The on-call engineer is responsible for keeping services simple to operate. Both prompts give zero worked examples.</desc>
<style>
  text { font-family: "Helvetica Neue", Arial, sans-serif; fill: #000000; }
  .title { font-size: 36px; font-weight: 700; }
  .intro { font-size: 21px; fill: #5C5C5C; }
  .section { font-size: 28px; font-weight: 700; }
  .body { font-size: 20px; }
  .label { font-size: 20px; font-weight: 700; }
  .small { font-size: 18px; fill: #5C5C5C; }
  .badge { font-size: 20px; font-weight: 700; }
  .card { fill: #FFFFFF; stroke: #D4DBE2; stroke-width: 1.5; }
  .soft { fill: #F3F5F7; }
  .row { fill: #F9FAFB; }
  .line { stroke: #E0E6EB; stroke-width: 1.5; }
</style>
<rect width="1100" height="1450" rx="24" fill="#F3F5F7"/>
<text x="40" y="62" class="title"><tspan x="40" dy="0">Examples and roles change different parts of a prompt</tspan></text>
<text x="40" y="126" class="intro"><tspan x="40" dy="0">Two comparisons. Change one ingredient at a time.</tspan></text>
<rect x="40" y="158" width="1020" height="718" rx="16" class="card"/>
<circle cx="79" cy="202" r="19" fill="#14A800"/>
<text x="72" y="209" class="badge"><tspan x="72" dy="0">A</tspan></text>
<text x="112" y="211" class="section"><tspan x="112" dy="0">Compare the number of worked examples</tspan></text>
<text x="64" y="251" class="intro"><tspan x="64" dy="0">Keep the same customer message, category choices, and response format.</tspan></text>
<rect x="64" y="272" width="972" height="140" rx="12" class="soft"/>
<text x="84" y="302" class="label"><tspan x="84" dy="0">Customer message</tspan></text>
<text x="84" y="332" class="body"><tspan x="84" dy="0">My package hasn&#x27;t arrived.</tspan></text>
<text x="84" y="366" class="small"><tspan x="84" dy="0">Choose one category: Billing, Delivery, or Login. Reply with the category only.</tspan></text>
<text x="84" y="453" class="label"><tspan x="84" dy="0">Prompt variant</tspan></text>
<text x="297" y="453" class="label"><tspan x="297" dy="0">Worked examples before the new message</tspan></text>
<rect x="64" y="472" width="972" height="76" rx="12" class="row"/>
<text x="84" y="501" class="label"><tspan x="84" dy="0">Zero-shot</tspan></text>
<text x="84" y="529" class="small"><tspan x="84" dy="0">0 examples</tspan></text>
<path d="M275 486 V534" class="line"/>
<text x="297" y="515" class="body"><tspan x="297" dy="0">No examples.</tspan></text>
<rect x="64" y="560" width="972" height="94" rx="12" class="row"/>
<text x="84" y="589" class="label"><tspan x="84" dy="0">One-shot</tspan></text>
<text x="84" y="617" class="small"><tspan x="84" dy="0">1 example</tspan></text>
<path d="M275 574 V640" class="line"/>
<text x="297" y="589" class="small"><tspan x="297" dy="0">My package arrived at the wrong address. → Delivery</tspan></text>
<rect x="64" y="666" width="972" height="142" rx="12" class="row"/>
<text x="84" y="695" class="label"><tspan x="84" dy="0">Few-shot</tspan></text>
<text x="84" y="723" class="small"><tspan x="84" dy="0">3 examples</tspan></text>
<path d="M275 680 V794" class="line"/>
<text x="297" y="695" class="small"><tspan x="297" dy="0">My package arrived at the wrong address. → Delivery</tspan></text>
<text x="297" y="722" class="small"><tspan x="297" dy="0">I was charged twice. → Billing</tspan></text>
<text x="297" y="749" class="small"><tspan x="297" dy="0">I can&#x27;t sign in. → Login</tspan></text>
<text x="64" y="846" class="small"><tspan x="64" dy="0">Expected category: Delivery.</tspan></text>
<rect x="40" y="904" width="1020" height="462" rx="16" class="card"/>
<circle cx="79" cy="948" r="19" fill="#14A800"/>
<text x="72" y="955" class="badge"><tspan x="72" dy="0">B</tspan></text>
<text x="112" y="957" class="section"><tspan x="112" dy="0">Ask two personas the same question</tspan></text>
<text x="64" y="999" class="body"><tspan x="64" dy="0">ShopEasy has phone and browser clients that need different tailored APIs. Which pattern fits?</tspan></text>
<text x="64" y="1032" class="small"><tspan x="64" dy="0">Choices: Bulkhead · API gateway · BFF</tspan></text>
<text x="64" y="1065" class="small"><tspan x="64" dy="0">Both prompts ask for one operational trade-off in two short sentences.</tspan></text>
<rect x="64" y="1090" width="474" height="156" rx="12" class="row"/>
<text x="84" y="1125" class="label"><tspan x="84" dy="0">Mobile developer</tspan></text>
<text x="84" y="1163" class="body"><tspan x="84" dy="0">You are the mobile developer responsible for</tspan><tspan x="84" dy="27">fast app screens.</tspan></text>
<rect x="562" y="1090" width="474" height="156" rx="12" class="row"/>
<text x="582" y="1125" class="label"><tspan x="582" dy="0">On-call engineer</tspan></text>
<text x="582" y="1163" class="body"><tspan x="582" dy="0">You are the on-call engineer responsible for</tspan><tspan x="582" dy="27">keeping services simple to operate.</tspan></text>
<text x="64" y="1284" class="label"><tspan x="64" dy="0">0 demonstrations in either prompt. Only the role instruction changes.</tspan></text>
<text x="64" y="1323" class="small"><tspan x="64" dy="0">Compare what each reply emphasizes, such as faster screens or simpler operations.</tspan></text>
<rect x="40" y="1392" width="6" height="27" rx="3" fill="#14A800"/>
<text x="60" y="1413" class="small"><tspan x="60" dy="0">Zero-shot still has instructions. Shots count worked input → output demonstrations, not requests.</tspan></text>
</svg>
