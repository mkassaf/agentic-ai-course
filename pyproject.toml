[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "agentic-ai-coursekit"
version = "0.4.0"
description = "Small reusable helpers for the Agentic AI, Step by Step course"
requires-python = ">=3.11"

[project.optional-dependencies]
rag = ["chromadb==1.5.9"]
mcp = ["mcp==2.3.0"]
a2a = ["a2a-sdk[http-server]==1.3.0"]
framework = ["langgraph==1.0.2"]
eval = ["mlflow==2.20.0"]

[tool.setuptools.packages.find]
include = ["coursekit*"]

[tool.setuptools.package-data]
coursekit = ["skills/*/SKILL.md"]
