name: Verify course

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - run: python -m pip install -r requirements-dev.txt
      - run: python scripts/build_notebooks.py
      - run: git diff --exit-code -- notebooks
      - run: python -m unittest discover -s tests -v
      - run: python scripts/check_course.py
      - run: python scripts/execute_notebooks.py
