name: Publish course

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - run: python -m pip install -r requirements-dev.txt
      - run: node scripts/export_diagrams.js
      - run: python scripts/build_notebooks.py
      - run: git diff --exit-code -- notebooks assets/diagrams
      - name: Configure published notebook links
        env:
          COURSE_REPOSITORY: ${{ github.repository }}
          COURSE_REF: ${{ github.ref_name }}
        run: python scripts/configure_repo.py "$COURSE_REPOSITORY" --ref "$COURSE_REF"
      - run: python -m unittest discover -s tests -v
      - run: python scripts/check_course.py
      - run: python scripts/execute_notebooks.py
      - name: Prepare static content
        run: |
          mkdir _site
          cp index.html course.json README.md .nojekyll _site/
          cp -R assets notebooks docs _site/
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: _site
  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
